name: Add issues to the user issues board

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.PROJECT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_BOT_PRIVATE_KEY }}
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/DeepL/projects/1
          github-token: ${{ steps.app-token.outputs.token }}
